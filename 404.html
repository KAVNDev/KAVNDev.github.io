<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#2b2d31" />
  <title>404 - Page Not Found | KAVN</title>
  <link rel="canonical" href="https://kavndev.github.io/" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png" />
  <style>
    /* Self-hosted fonts */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/inter-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Playfair Display';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('/fonts/playfair-800.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #2b2d31;
      color: #d9dadc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .error-page h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 8rem;
      font-weight: 800;
      opacity: 0.15;
      line-height: 1;
    }
    .error-page p {
      font-size: 1.25rem;
      color: rgba(217, 218, 220, 0.7);
      margin: 1rem 0 2rem;
    }
    .error-page a {
      display: inline-block;
      padding: 0.8rem 2rem;
      background: #ffc93c;
      color: #2b2d31;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.3s ease;
    }
    .error-page a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="error-page">
    <h1>404</h1>
    <p>This page doesn't exist. Let's get you back on track.</p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
